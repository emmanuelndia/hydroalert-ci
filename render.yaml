# Deploiement de l'API HydrO'Alerte CI sur Render (offre gratuite).
# La base PostgreSQL/PostGIS est hebergee chez Neon : voir docs/Deploiement_HydrOAlerte_CI.txt.
# Les valeurs marquees "sync: false" sont saisies dans le tableau de bord Render, jamais dans ce fichier.
services:
  - type: web
    name: hydroalert-api
    runtime: node
    plan: free
    region: frankfurt
    branch: backend
    autoDeploy: true
    buildCommand: npm install -g pnpm@11.15.1 && pnpm install --frozen-lockfile --prod=false && pnpm build
    # Applique les migrations Prisma en attente, puis lance le serveur compile.
    startCommand: npm run start:render
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render place un proxy devant l'API : l'adresse du client est lue dans X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      # Requetes autorisees par minute et par adresse IP (0 desactive la limite).
      - key: RATE_LIMIT_MAX
        value: "120"
      # Render fournit PORT automatiquement.
      - key: DATABASE_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
