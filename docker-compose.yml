services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: hydroalert
      POSTGRES_USER: hydroalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydroalert}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
